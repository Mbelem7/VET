{% extends "layout.html" %}

{% block title %}
<title>Agregar Propietarios</title>
{% endblock %}

{% block css %}
<link rel="stylesheet" href="../static/styles/stylesindex.css">
{% endblock %}

{% block body %}
<div class="mascotas">
  <h2 class="menu">Propietarios</h2>
  <br>
  <form action="/agregarpropietario" method="post">
    <div class="form-container">
      <div class="form-box">
        <!-- DATOS PROPIETARIO -->
        <section class="formulario">
          <h3> Ingrese los Datos del Propietario</h3>
          <br>
          <div class="info">
            <label for="nombrep">Nombre: </label>
            <input type="text" class="form-control" placeholder="Nombre del Propietario" required id="nombrep"
              name="nombrep" />
          </div>

          <div class="info">
            <label for="apellidop">Apellido: </label>
            <input type="text" class="form-control" placeholder="Apellido del Propietario" required id="apellidop"
              name="apellidop" />
          </div>

          <div class="info">
            <label for="cedp">Cédula: </label>
            <input type="text" class="form-control" placeholder="Cédula del Propietario" required id="cedp" name="cedp">
          </div>

          <div class="info">
            <label for="telp">Teléfono: </label>
            <input type="text" class="form-control" placeholder="Teléfono del Propietario" required id="telp"
              name="telp" />
          </div>

          <div class="info">
            <label for="corp">Correo: </label>
            <input type="email" class="form-control" placeholder="Correo del Propietario" required id="corp"
              name="corp">
          </div>

          <div class="info">
            <label for="dirp">Dirección: </label>
            <input type="text" class="form-control" placeholder="Dirección del Propietario" required id="dirp"
              name="dirp" />
          </div>

          <label for="tipop">Tipo:</label>
          <select class="form-control" name="tipop" id="tipop">
            {% for i in categ %}
            <option value="{{ i[0] }}">{{ i[1] }}</option>
            {% endfor %}

          </select>
          <br>
          <br>

          <label for="mascotap">Mascota:</label>
          <select name="mascotap" required>
            {% for m in mascot %}
            <option value="{{ m[0] }}">{{ m[1] }}</option>
            {% endfor %}
          </select>

          <br>
          <br>

          <div class="botonesproducto">
            <input type="submit" value="Guardar" id="agregar-mascota">
            <button class="btn btn-danger">Cancelar</button>
          </div>


        </section>
        <br>
      </div>
    </div>

  </form>


</div>

{% endblock %}

{% block js %}
{% endblock %}
