{% extends "layout.html" %}

{% block title %}
<title>Agregar Servicio</title>
{% endblock %}

{% block css %}
<link rel="stylesheet" href="../static/styles/stylesindex.css">
{% endblock %}

{% block body %}
<div class="bodycompra">
    <h2 class="productos">Nuevo Servicio</h2>
     <form action="/agregarservicio" method="post" enctype="multipart/form-data">
        <div class="form-container">
             <div class="form-box">
                 <section class="formulario">
                    <h3> Ingrese los datos del nuevo servicio</h3>
                    <br>
                    <div class="contenedorlabel">
                        <div class="info">
                            <label for="nombres">Nombre: </label>
                            <input type="text" class="form-control" placeholder="Nombres del producto" required
                                id="nombres" name="nombres" data-letras/>
                        </div>

                         <br>
                        <div class="upload-area" id="drop-area">
                            <p>Arrastra la imagen aquí</p>
                            <input type="file" id="fileElem" name="imagenurl" accept="image/*" style="display:none"
                                required>
                            <button type="button" onclick="document.getElementById('fileElem').click()">Seleccionar
                                imagen</button>
                            <p id="fileName" style="margin-top:10px;"></p>
                        </div>
                        <br>
                         <div class="info">
                            <label for="precios">Precio estimado: </label>
                            <input type="number" class="form-control" placeholder="Precio" required id="precios"
                                name="precios" />
                        </div>
                        <div class="info">
                            <label for="descrips">Descripción: </label>
                            <input type="text" class="form-control" placeholder="Descripcion" required id="descrips"
                                name="descrips" />
                        </div>
                    </div>
                    <br>
                    <div class="botonesproducto">
                        <input type="submit" value="Guardar" id="agregar-mascota">
                    </div>
                 </section>
             </div>
        </div>
     </form>
</div>
{% endblock %}

{% block js %}
<script src="{{ url_for('static', filename='js/validaciones.js') }}"></script>
<script src="../static/js/subir.js"></script>
{% endblock %}
