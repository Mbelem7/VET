{% extends "layout.html" %}

{% block title %}
<title>Editar producto</title>
{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='styles/stylesindex.css') }}">
{% endblock %}

{% block body %}
<div class="bodycompra">
    <form method="post">
        <div class="form-container">
            <div class="form-box">
                <section class="formulario">
                    <h3>Editar producto</h3>
                    <div class="contenedorlabel">
                        <div class="info">
                            <label>Nombre:</label>
                            <span>{{ producto[1] }}</span>
                        </div>
                        <div class="info">
                            <label>Descripción:</label>
                            <span>{{ producto[3] }}</span>
                        </div>
                        <div class="info">
                            <label>Imagen:</label><br>
                            {% if producto[2] %}
                                <img src="{{ url_for('static', filename=producto[2].split('static/')[-1]) }}" alt="Imagen producto" style="max-width:120px;">
                            {% else %}
                                <span>No hay imagen</span>
                            {% endif %}
                        </div>
                        <div class="info">
                            <label for="preciop">Precio:</label>
                            <input type="number" step="0.01" class="form-control" id="preciop" name="preciop" required value="{{ producto[4] }}">
                        </div>
                        <div class="info">
                            <label for="unidadesp">Unidades actuales:</label>
                            <input type="number" class="form-control" id="unidadesp" name="unidadesp" value="{{ producto[6] }}" readonly>
                        </div>
                        <div class="info">
                            <label for="unidades_agregar">Unidades a agregar:</label>
                            <input type="number" class="form-control" id="unidades_agregar" name="unidades_agregar" value="0" min="0">
                        </div>
                        <div class="info">
                            <label for="proveedor_id">Proveedor:</label>
                            <select id="proveedor_id" name="proveedor_id" class="form-control" required>
                                <option value="">Seleccione un proveedor</option>
                                {% for prov in proveedores %}
                                <option value="{{ prov[0] }}" {% if producto[10] == prov[0] %}selected{% endif %}>
                                    {{ prov[2] }} {{ prov[3] }} ({{ prov[8] }})
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        
                    </div>
                    <br>
                    <button type="submit" class="btn btn-primary btnproducto">Guardar cambios</button>
                    <a href="{{ url_for('productos') }}" class="btn btn-secondary btnproducto">Cancelar</a>
                </section>
            </div>
        </div>
    </form>
</div>
{% endblock %}

{% block js %}
{% endblock %}
