{% extends "layout.html" %}

{% block title %}
<title>Editar producto</title>
{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='styles/stylesindex.css') }}">
{% endblock %}

{% block body %}
<div class="bodycompra">
    <form method="post">
        <div class="form-container">
            <div class="form-box">
                <section class="formulario">
                    <h3>Editar producto</h3>
                    <div class="contenedorlabel">
                        <div class="info">
                            <label>Nombre:</label>
                            <span>{{ producto[1] }}</span>
                        </div>
                        <div class="info">
                            <label>Descripción:</label>
                            <span>{{ producto[3] }}</span>
                        </div>
                        <div class="info">
                            <label>Imagen:</label><br>
                            {% if producto[2] %}
                                <img src="{{ url_for('static', filename=producto[2].split('static/')[-1]) }}" alt="Imagen producto" style="max-width:120px;">
                            {% else %}
                                <span>No hay imagen</span>
                            {% endif %}
                        </div>
                        <div class="info">
                            <label for="preciop">Precio:</label>
                            <input type="number" step="0.01" class="form-control" id="preciop" name="preciop" required value="{{ producto[4] }}">
                        </div>
                        <div class="info">
                            <label for="unidadesp">Unidades:</label>
                            <input type="number" class="form-control" id="unidadesp" name="unidadesp" required value="{{ producto[5] }}">
                        </div>
                    </div>
                    <br>
                    <button type="submit" class="btn btn-primary">Guardar cambios</button>
                    <a href="{{ url_for('productos') }}" class="btn btn-secondary">Cancelar</a>
                </section>
            </div>
        </div>
    </form>
</div>
{% endblock %}

{% block js %}
{% endblock %}
